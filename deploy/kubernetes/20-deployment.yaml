apiVersion: apps/v1
kind: Deployment
metadata:
  name: jpetstore
  namespace: jpetstore
  labels:
    app.kubernetes.io/name: jpetstore
spec:
  # JPetStore keeps the cart in the HTTP session and uses an in-memory HSQLDB per pod,
  # so a single replica gives consistent behavior. See README "Known limitations".
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jpetstore
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jpetstore
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jpetstore
          # Replaced at deploy time (Jenkins kubernetesDeploy step or the Ansible playbook).
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CATALINA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /jpetstore/
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /jpetstore/
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: work, mountPath: /usr/local/tomcat/work }
            - { name: temp, mountPath: /usr/local/tomcat/temp }
            - { name: logs, mountPath: /usr/local/tomcat/logs }
      volumes:
        - { name: work, emptyDir: {} }
        - { name: temp, emptyDir: {} }
        - { name: logs, emptyDir: {} }
